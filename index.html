<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uomo Project</title>
    <!-- Google Font Part Start -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- Google Font End Start -->
    <!-- All CSS FILES START -->
     <link rel="stylesheet" href="css/all.min.css">
     <link rel="stylesheet" href="css/bootstrap.min.css">
     <link rel="stylesheet" href="css/style.css">
    <!-- All CSS FILES End -->
</head>
<body>
    <!-- Header Part Start -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="images/logo.png" alt="logo.png">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="#">HOME</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">SHOP</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">COLLECTION</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">JOURNAL</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">LOOKBOOK</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">PAGES</a>
                    </li>
                </ul>
                <div class="menuIcons">
                    <i class="fa-brands fa-sistrix"></i>
                    <i class="fa-regular fa-user"></i>
                    <i class="fa-regular fa-heart"></i>
                    <i class="fa-solid fa-bag-shopping"></i>
                    <i class="fa-solid fa-bars-staggered"></i>
                    <div class="menuNum">3</div>
                </div>
            </div>
        </div>
    </nav>
    <!-- Header Part End -->


    <!-- Banner Part Start -->
    <section id="bannerPart">
            <!-- <div class="bannerSocial">
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-pinterest"></i>
                <p>FOLLOW US</p>
            </div> -->
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <a href="#">
                            <img src="images/slider.png" alt="slider.png" class="img-fluid w-100">
                         </a>
                    </div>
                </div>
            </div>
    </section>
    <!-- Banner Part End -->


    <!-- Ads Part Start -->
     <section id="adsPart">
        <div class="container">
            <div class="row">
                <div class="col-lg-6">
                    <a href="#">
                        <picture>
                            <img src="images/women.png" alt="women.png" class="img-fluid w-100">
                        </picture>
                    </a>
                </div>
                <div class="col-lg-6">
                    <a href="#">
                        <picture>
                            <img src="images/men.png" alt="men.png" class="img-fluid w-100">
                        </picture>
                     </a>
                     <div class="row mt-4">
                        <div class="col-lg-6">
                            <picture>
                                <img src="images/kid.png" alt="men.png" class="img-fluid w-100">
                            </picture>
                        </div>
                        <div class="col-lg-6">
                            <picture>
                                <img src="images/gift.png" alt="men.png" class="img-fluid w-100">
                            </picture>
                        </div>
                     </div>
                </div>
            </div>
        </div>
     </section>
    <!-- Ads Part End -->

    <!-- Products Part  Start -->
      <section id="productsPart">
        <div class="container">
            <div class="row">
                <div class="col-lg-5 m-auto text-center">
                    <div class="productTitle">
                        <h3>OUR TRENDY <strong>PRODUCTS</strong></h3>
                    </div>
                    <div class="filterBtn mt-4">
                        <button>ALL</button>
                        <button>NEWARRIVALS</button>
                        <button>BEST SELLER</button>
                        <button>TOP RATING</button>
                    </div>
                                                    
                </div>
            </div>
            <div class="row mt-4">
                <div class="col-lg-3 mb-4">
                    <div class="productItem">
                        <img src="images/Product1.png" alt="Product1.png" class="img-fluid w-100">
                    </div>
                </div>
                <div class="col-lg-3 mb-4">
                    <div class="productItem">
                        <img src="images/Product2.png" alt="Product2.png" class="img-fluid w-100">
                    </div>
                </div>
                <div class="col-lg-3 mb-4">
                    <div class="productItem">
                        <img src="images/Product3.png" alt="Product3.png" class="img-fluid w-100">
                    </div>
                </div>
                <div class="col-lg-3 mb-4">
                    <div class="productItem">
                        <img src="images/Product4.png" alt="Product4.png" class="img-fluid w-100">

                <div class="col-lg-3 mb-4">

                </div>
                <div class="col-lg-3 mb-4">
                    <div class="productItem">
                        <img src="images/Product7.png" alt="Product7.png" class="img-fluid w-100">
                    </div>
                </div>
                <div class="col-lg-3 mb-4">
                    <div class="productItem">
                        <img src="images/Product8.png" alt="Product8.png" class="img-fluid w-100">
                    </div>
                </div>
            </div>
        </div>
      </section>
    <!-- Products Part End -->
    
    <!-- Countdown Part Start -->
      <section id="CountdownPart">
        
      </section>
    <!-- Countdown Part End -->

    <!-- All JS FILE START -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-1.12.4.min.js"></script>
    <script src="js/script.js"></script>
    <!-- All JS FILE End -->
</body>
</html>
